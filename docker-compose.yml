version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kuairec-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/testdata
      - DB_PATH=/app/data/recommendations.db
      - DEFAULT_TOP_K=10
    volumes:
      - backend-db:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kuairec-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_INTERNAL_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-db:
